name: Build MonitorAgent EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          python -c "import customtkinter; print('customtkinter OK')"
          python -c "import telegram; print('telegram OK')"
          pyinstaller build.spec --noconfirm --clean
          dir dist
          python -c "import os; s=os.path.getsize('dist/MonitorAgent.exe'); print(f'EXE size: {s/1024/1024:.1f} MB')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitorAgent-windows
          path: dist/MonitorAgent.exe
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MonitorAgent.exe
          generate_release_notes: true
